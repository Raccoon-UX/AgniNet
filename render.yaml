# Render Blueprint specification for AgniNet
# Temporary Free-Tier Deployment Configuration
# Reference: https://render.com/docs/blueprint-spec
# NOTE: The free tier uses ephemeral /tmp storage for SQLite (/tmp/agninet_historical.db).
# Historical records stored in /tmp are temporary and will be cleared on instance spin-down, restarts, or redeployments.

services:
  # AgniNet FastAPI Backend Service
  - type: web
    name: agninet-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /tmp/agninet_historical.db
      - key: ENVIRONMENT
        value: production
      - key: INGESTION_API_KEY
        generateValue: true
      - key: NASA_ARCHIVE_INGESTION_KEY
        generateValue: true
      - key: NASA_FIRMS_MAP_KEY
        sync: false  # Must be manually entered in Render Dashboard under Environment

  # AgniNet Next.js Frontend Service
  - type: web
    name: agninet-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: agninet-api
          property: host
